[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "komichi-crawler"
version = "1.1.0"
description = "Komichi 共享爬虫运行时（CLI 与 crawler-daemon 共用）"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.24",
    "curl-cffi>=0.7",
    "parsel>=1.8",
    "playwright>=1.40",
]

[tool.setuptools]
packages = ["komichi_crawler"]
